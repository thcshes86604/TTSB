<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA 最佳化標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TTSB 雷達">
    <title>TTSB 事故調查錄影調閱系統 - 電影拍攝用</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #080c10; overflow: hidden; font-family: "Courier New", Courier, monospace; color: #b5c6d3; touch-action: none; }

        #top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 35px; background-color: #1a1010; border-bottom: 2px solid #a94442; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 15px; font-weight: bold; z-index: 5; }
        .replay-alert { color: #ff4444; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .utc-time { color: #ff7777; background: rgba(255, 0, 0, 0.1); padding: 2px 8px; border-radius: 3px; }
        canvas { display: block; margin-top: 35px; cursor: crosshair; }

        #cursor-coords { position: absolute; top: 45px; left: 15px; background: rgba(8, 12, 16, 0.85); border: 1px solid #324354; padding: 8px 12px; font-size: 13px; color: #6495ed; z-index: 10; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); line-height: 1.4; }
        #control-panel { position: absolute; top: 45px; right: 15px; width: 330px; background-color: rgba(18, 26, 36, 0.95); border: 1px solid #324354; border-radius: 6px; padding: 12px; font-family: sans-serif; z-index: 20; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .panel-header { font-size: 13px; font-weight: bold; color: #6495ed; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #324354; padding-bottom: 6px; }
        .close-btn { color: #a94442; cursor: pointer; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 3px; background: rgba(169, 68, 66, 0.15); }
        .close-btn:hover { background: rgba(169, 68, 66, 0.35); }
        .panel-section { background: rgba(12, 18, 24, 0.6); border: 1px solid #253342; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
        .section-title { font-size: 11px; font-weight: bold; color: #7b9ab0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .form-row { display: flex; gap: 8px; margin-bottom: 6px; }
        .form-group { display: flex; flex-direction: column; flex: 1; margin-bottom: 6px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label { font-size: 11px; color: #9ab; margin-bottom: 2px; }
        .form-group input, .form-group select { width: 100%; background: #080c10; border: 1px solid #324354; color: #fff; padding: 8px; font-size: 12px; border-radius: 3px; font-family: "Courier New", Courier, monospace; }
        .form-group input:focus, .form-group select:focus { border-color: #6495ed; outline: none; }
        
        .btn { width: 100%; border: none; padding: 10px; cursor: pointer; border-radius: 3px; font-size: 12px; font-weight: bold; font-family: inherit; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-add { background: #3b5998; color: #fff; margin-top: 4px; }
        .btn-sweep { background: #2b3e50; color: #b5c6d3; border: 1px solid #324354; margin-top: 4px; }
        .btn-reset { background: #a94442; color: #fff; border: 1px solid #7a2c2b; margin-top: 4px; }
        .btn-time { background: #a56a31; color: #fff; white-space: nowrap; padding: 8px 15px; }
        
        #plane-list { max-height: 100px; overflow-y: auto; margin-top: 4px; }
        .plane-item { display: flex; justify-content: space-between; align-items: center; background: #080c10; padding: 5px 8px; margin-bottom: 3px; border: 1px solid #253342; font-size: 12px; border-radius: 2px; }
        .btn-delete { background: #a94442; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 2px; font-size: 10px; }
        .global-hint { font-size: 11px; color: #678; margin-top: 8px; text-align: center; border-top: 1px dashed #253342; padding-top: 6px; }

        #playback-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 55px; background-color: #121a24; border-top: 2px solid #324354; display: flex; align-items: center; padding: 0 20px; z-index: 100; }
        .pb-btn { background: #253342; border: 1px solid #455a64; color: #b5c6d3; padding: 8px 16px; margin-right: 10px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 14px; border-radius: 3px; }
        .pb-btn:hover { background: #324354; }
        .pb-btn.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        .pb-btn.speed-active { background: #3b5998; color: white; border-color: #6495ed; }
        
        #timeline { flex-grow: 1; height: 16px; background: #080c10; border-radius: 8px; margin: 0 20px; position: relative; border: 1px solid #324354; cursor: pointer; }
        #timeline-fill { height: 100%; width: 0%; background: #6495ed; border-radius: 7px; pointer-events: none; }
        #timeline-handle { position: absolute; top: -4px; bottom: -4px; width: 12px; background: #fff; left: 0%; transform: translateX(-50%); border-radius: 6px; box-shadow: 0 0 5px rgba(0,0,0,0.8); pointer-events: none; }
        #pb-timecode { font-size: 20px; color: #fff; font-weight: bold; background: #000; padding: 4px 12px; border: 1px solid #455a64; border-radius: 4px; }

        @media (max-width: 768px) {
            #top-bar { padding: 0 10px; font-size: 11px; }
            .replay-alert { font-size: 10px; }
            .hide-on-mobile { display: none; }
            #cursor-coords { top: 40px; left: 10px; padding: 4px 8px; font-size: 10px; }
            #control-panel { top: 45px; left: 50%; right: auto; transform: translateX(-50%); width: 95%; max-width: 380px; max-height: 75vh; overflow-y: auto; }
            #playback-bar { padding: 0 5px; height: auto; padding-top: 5px; padding-bottom: 5px; flex-wrap: wrap; justify-content: center; gap: 5px; }
            .pb-btn { font-size: 11px; padding: 6px 10px; margin-right: 0; }
            #timeline { width: 100%; margin: 5px 10px; order: -1; } 
            #pb-timecode { font-size: 15px; padding: 3px 8px; }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="replay-alert">● PLAYBACK <span class="hide-on-mobile">| TTSB_INV_FILE: CAL001</span></div>
        <div style="color: #6495ed;" class="hide-on-mobile">SOURCE: SPACE-BASED ADS-B | SECTOR: OCEANIC</div>
        <div class="utc-time" id="clock">等待同步...</div>
    </div>

    <div id="cursor-coords">LAT: S 24°00'00"<br>LON: E 178°00'00"</div>
    <canvas id="radarCanvas"></canvas>

    <div id="playback-bar">
        <div id="timeline"><div id="timeline-fill"></div><div id="timeline-handle"></div></div>
        <button class="pb-btn" id="pb-play">▶ PLAY</button>
        <button class="pb-btn pb-speed speed-active" data-speed="1">1x</button>
        <button class="pb-btn pb-speed" data-speed="2">2x</button>
        <button class="pb-btn pb-speed" data-speed="4">4x</button>
        <div id="pb-timecode">15:30:00.000 Z</div>
    </div>

    <div id="control-panel">
        <div class="panel-header"><span>📡 拍攝控制面板</span><span class="close-btn" onclick="togglePanelVisibility()">[X] 隱藏 (H)</span></div>
        <div class="panel-section">
            <div class="section-title">⏱️ 錄影時間連戲</div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>起始 UTC 時間 (HH:MM:SS):</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="inputTime" value="15:30:00" style="flex: 1;">
                    <button class="btn btn-time" style="width: auto;" onclick="setCustomTime(true)">更新時間</button>
                </div>
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">✈️ 新增航跡目標</div>
            <div class="form-row">
                <div class="form-group"><label>呼號:</label><input type="text" id="inputId" value="EVA201"></div>
                <div class="form-group"><label>目標航點:</label><select id="inputWaypoint"><option value="MUKAM">MUKAM</option><option value="LMWO">LMWO</option><option value="KLDWA" selected>KLDWA</option><option value="PACIF">PACIF</option></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>相對X座標:</label><input type="number" id="inputX" value="-250"></div>
                <div class="form-group"><label>相對Y座標:</label><input type="number" id="inputY" value="-350"></div>
                <div class="form-group"><label>速度:</label><input type="number" id="inputSpeed" value="0.8" step="0.1"></div>
            </div>
            <div class="form-group"><label>高度與速度標籤:</label><input type="text" id="inputAltSpd" value="350=  45"></div>
            <button class="btn btn-add" onclick="addPlane()">➕ 加入目標 (並儲存設定)</button>
        </div>
        <div class="panel-section">
            <div class="section-title">🎛️ 系統動作</div>
            <button class="btn btn-sweep" onclick="toggleSweep()">🔄 傳統掃描特效：<span id="sweepStatus">關閉</span></button>
            <button class="btn btn-reset" onclick="resetToConfig()">⚠️ 還原成 config.json 初始設定</button>
        </div>
        <div class="panel-section"><div class="section-title">📋 當前目標清單</div><div id="plane-list"></div></div>
        <div class="global-hint">快捷鍵 [H] 隱藏面板 | [F] 全螢幕</div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        
        const STORAGE_KEY = 'ttsb_radar_config';
        const CONFIG_URL = 'config.json';
        
        let initialPlanes = []; 
        let planes = [];
        let lkpMarks = []; 
        let isMoving = false;    
        let showSweep = false; 
        let playbackSpeed = 1; 

        // 航點改成相對中心座標
        const waypoints = { "MUKAM": { x: -420, y: -280 }, "LMWO": { x: 490,  y: -150 }, "KLDWA": { x: 280,  y: 300 }, "PACIF": { x: -300, y: 250 } };

        let timelineStartTime = Date.now();
        let simulatedTimestamp = timelineStartTime; 
        let lastSimulatedTimestamp = simulatedTimestamp;
        let lastTickTime = Date.now();
        const timelineDuration = 65 * 1000; 

        const CENTER_LAT = -24.0; const CENTER_LON = 178.0; const DEG_PER_PX = 0.003; 

        async function initApp() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                console.log("📥 從 LocalStorage 載入修改過的設定");
                applySettings(JSON.parse(savedData));
            } else {
                console.log("📥 載入全新預設 config.json");
                await loadDefaultConfig();
            }
            requestAnimationFrame(drawRadar);
        }

        async function loadDefaultConfig() {
            try {
                const response = await fetch(CONFIG_URL);
                if (!response.ok) throw new Error('找不到 config.json');
                const data = await response.json();
                applySettings(data);
            } catch (error) {
                alert("無法讀取 config.json，請確保您是透過 Live Server 執行網頁！\n" + error.message);
            }
        }

        function applySettings(data) {
            document.getElementById('inputTime').value = data.startTime;
            
            initialPlanes = data.planes.map(p => {
                let heading = p.heading;
                if (heading === undefined && p.status && waypoints[p.status]) {
                    const dx = waypoints[p.status].x - p.x;
                    const dy = waypoints[p.status].y - p.y;
                    heading = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                    if (heading < 0) heading += 360;
                }
                return { ...p, heading: heading, history: [], scriptPhase: 0, outOfBounds: false };
            });

            setCustomTime(false);
            updatePlaneListUI();
        }

        function saveToLocal() {
            const data = {
                startTime: document.getElementById('inputTime').value,
                planes: initialPlanes.map(p => ({
                    id: p.id, x: p.x, y: p.y, heading: p.heading, speed: p.speed, altSpd: p.altSpd, status: p.status
                }))
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function resetToConfig() {
            if(confirm("⚠️ 確定要捨棄所有修改，還原成 config.json 的初始設定嗎？")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload(); 
            }
        }

        function setCustomTime(triggerSave = true) {
            const timeStr = document.getElementById('inputTime').value;
            const parts = timeStr.split(':');
            if(parts.length >= 2) {
                const now = new Date();
                const targetTime = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), parseInt(parts[0])||0, parseInt(parts[1])||0, parseInt(parts.length>2?parts[2]:0)||0));
                
                timelineStartTime = targetTime.getTime();
                isMoving = false;
                document.getElementById('pb-play').innerHTML = '▶ PLAY';
                document.getElementById('pb-play').classList.remove('active');
                updateTimelineUI(0);
                
                planes = JSON.parse(JSON.stringify(initialPlanes));
                lkpMarks = [];
                simulatedTimestamp = timelineStartTime;
                lastSimulatedTimestamp = timelineStartTime;
                renderClockUI(); 
                
                if (triggerSave) saveToLocal();
            }
        }

        function stepPhysics(dtMs) {
            const frameRatio = dtMs / 16.666; 
            planes.forEach(plane => {
                const rad = (plane.heading - 90) * Math.PI / 180;
                plane.x += Math.cos(rad) * (plane.speed / 2) * frameRatio;
                plane.y += Math.sin(rad) * (plane.speed / 2) * frameRatio;

                if (plane.id === "CAL001") {
                    // 使用中心點相對座標觸發，所有裝置一致
                    if (plane.scriptPhase === 0 && plane.y > -100) {
                        plane.status = "7700"; plane.altSpd = "280↓  38"; plane.speed = 0.5; plane.scriptPhase = 1;
                    }
                    if (plane.scriptPhase === 1 && plane.y > 0) {
                        plane.altSpd = "120↓↓ 28"; plane.speed = 0.2; plane.scriptPhase = 2;
                    }
                    if (plane.scriptPhase === 2 && plane.y > 80) {
                        plane.status = "CST"; plane.altSpd = "---   --"; plane.speed = 0.1; plane.scriptPhase = 3; plane.cstAccumulator = 0; 
                        const d = new Date(simulatedTimestamp);
                        const tStr = `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
                        lkpMarks.push({ x: plane.x, y: plane.y, time: tStr });
                    }
                    if (plane.scriptPhase === 3) {
                        plane.cstAccumulator += dtMs;
                        if (plane.cstAccumulator > 5000) plane.outOfBounds = true; 
                    }
                }

                // 邊界判定改為相對邏輯 (容錯範圍加大，避免提早消失)
                if (plane.x > 2500 || plane.x < -2500 || plane.y > 2500 || plane.y < -2500) plane.outOfBounds = true;

                plane.histTimer = (plane.histTimer || 0) + dtMs;
                if (plane.histTimer >= 1000) { 
                    plane.histTimer = 0;
                    plane.history.push({ x: plane.x, y: plane.y });
                    if (plane.history.length > 5) plane.history.shift(); 
                }
            });
            planes = planes.filter(p => !p.outOfBounds);
        }

        function simulateTo(targetTimestamp) {
            planes = JSON.parse(JSON.stringify(initialPlanes));
            lkpMarks = [];
            let currentSimTime = timelineStartTime;
            const STEP_MS = 16.666; 
            while (currentSimTime < targetTimestamp) {
                let dt = Math.min(STEP_MS, targetTimestamp - currentSimTime);
                simulatedTimestamp = currentSimTime + dt; 
                stepPhysics(dt);
                currentSimTime += dt;
            }
            simulatedTimestamp = targetTimestamp;
            lastSimulatedTimestamp = targetTimestamp;
            renderClockUI();
        }
        
        let isDraggingTimeline = false;
        const timeline = document.getElementById('timeline');
        const timelineFill = document.getElementById('timeline-fill');
        const timelineHandle = document.getElementById('timeline-handle');

        function updateTimelineUI(percent) {
            timelineFill.style.width = (percent * 100) + '%';
            timelineHandle.style.left = (percent * 100) + '%';
        }

        function getClientX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
        function getClientY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

        function scrubTimeline(e) {
            const rect = timeline.getBoundingClientRect();
            let percent = (getClientX(e) - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            updateTimelineUI(percent);
            const targetTime = timelineStartTime + (percent * timelineDuration);
            simulateTo(targetTime);
        }

        function handleTimelineStart(e) {
            isDraggingTimeline = true; isMoving = false;
            document.getElementById('pb-play').innerHTML = '▶ PLAY';
            document.getElementById('pb-play').classList.remove('active');
            scrubTimeline(e);
        }

        timeline.addEventListener('mousedown', handleTimelineStart);
        timeline.addEventListener('touchstart', handleTimelineStart, {passive: true});

        function handleTimelineMove(e) {
            if (isDraggingTimeline) {
                if(e.type === 'touchmove') e.preventDefault();
                scrubTimeline(e);
            }
        }
        document.addEventListener('mousemove', handleTimelineMove);
        document.addEventListener('touchmove', handleTimelineMove, {passive: false});

        function handleTimelineEnd() { if (isDraggingTimeline) isDraggingTimeline = false; }
        document.addEventListener('mouseup', handleTimelineEnd);
        document.addEventListener('touchend', handleTimelineEnd);

        function updateClock() {
            const now = Date.now();
            const delta = now - lastTickTime;
            lastTickTime = now;

            if (isMoving && !isDraggingTimeline) {
                simulatedTimestamp += (delta * playbackSpeed);
                let progress = (simulatedTimestamp - timelineStartTime) / timelineDuration;
                if (progress >= 1) { 
                    progress = 1; isMoving = false;
                    document.getElementById('pb-play').innerHTML = '▶ PLAY';
                    document.getElementById('pb-play').classList.remove('active');
                }
                updateTimelineUI(progress);
            }
            renderClockUI();
        }

        function renderClockUI() {
            const d = new Date(simulatedTimestamp);
            const h = String(d.getUTCHours()).padStart(2, '0');
            const m = String(d.getUTCMinutes()).padStart(2, '0');
            const s = String(d.getUTCSeconds()).padStart(2, '0');
            const ms = String(d.getUTCMilliseconds()).padStart(3, '0');
            
            const blink = (!isMoving && Math.floor(Date.now() / 500) % 2 === 0) ? ' ' : ':';
            document.getElementById('clock').innerText = `${h}${blink}${m}${blink}${s} UTC`;
            document.getElementById('pb-timecode').innerText = `${h}:${m}:${s}.${ms} Z`;
        }
        setInterval(updateClock, 50);

        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            const pbHeight = document.getElementById('playback-bar').offsetHeight;
            canvas.height = window.innerHeight - 35 - pbHeight; 
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        function handleHoverCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = getClientX(e) - rect.left;
            const mouseY = getClientY(e) - rect.top;

            const latDiff = (mouseY - (canvas.height / 2)) * DEG_PER_PX;
            const lonDiff = (mouseX - (canvas.width / 2)) * DEG_PER_PX;
            const currentLat = CENTER_LAT - latDiff; const currentLon = CENTER_LON + lonDiff;
            
            const absLat = Math.abs(currentLat); const latDeg = Math.floor(absLat); const latMin = Math.floor((absLat - latDeg) * 60); const latSec = Math.floor(((absLat - latDeg) * 60 - latMin) * 60);
            const absLon = Math.abs(currentLon); const lonDeg = Math.floor(absLon); const lonMin = Math.floor((absLon - lonDeg) * 60); const lonSec = Math.floor(((absLon - lonDeg) * 60 - lonMin) * 60);

            document.getElementById('cursor-coords').innerHTML = 
                `LAT: ${currentLat>=0?'N':'S'} ${String(latDeg).padStart(2,'0')}°${String(latMin).padStart(2,'0')}'${String(latSec).padStart(2,'0')}"<br>` +
                `LON: ${currentLon>=0?'E':'W'} ${String(lonDeg).padStart(3,'0')}°${String(lonMin).padStart(2,'0')}'${String(lonSec).padStart(2,'0')}"`;
        }
        canvas.addEventListener('mousemove', handleHoverCoords);
        canvas.addEventListener('touchmove', handleHoverCoords, {passive: true});

        function handleCanvasTap(e) {
            const panel = document.getElementById('control-panel');
            if (panel.style.display !== 'none') {
                const rect = canvas.getBoundingClientRect();
                // 點擊轉換為中心相對座標
                document.getElementById('inputX').value = Math.round(getClientX(e) - rect.left - (canvas.width / 2));
                document.getElementById('inputY').value = Math.round(getClientY(e) - rect.top - (canvas.height / 2));
            }
        }
        canvas.addEventListener('mousedown', handleCanvasTap);
        canvas.addEventListener('touchstart', handleCanvasTap, {passive: true});

        function addPlane() {
            const id = document.getElementById('inputId').value;
            const speed = parseFloat(document.getElementById('inputSpeed').value) || 0.8;
            const altSpd = document.getElementById('inputAltSpd').value;
            const wpName = document.getElementById('inputWaypoint').value;
            const x = parseFloat(document.getElementById('inputX').value);
            const y = parseFloat(document.getElementById('inputY').value);

            // 由於全部改成相對座標，這裡的計算直接減即可，不需再牽扯 canvas 寬高
            const dx = waypoints[wpName].x - x;
            const dy = waypoints[wpName].y - y;
            let heading = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            if (heading < 0) heading += 360;

            initialPlanes.push({ id, x, y, heading, speed, altSpd, status: wpName, history: [], scriptPhase: 0 });
            
            saveToLocal();
            simulateTo(simulatedTimestamp);
            updatePlaneListUI();
        }

        document.getElementById('pb-play').addEventListener('click', function() {
            isMoving = !isMoving;
            if (isMoving) { this.innerHTML = '⏸ PAUSE'; this.classList.add('active'); } 
            else { this.innerHTML = '▶ PLAY'; this.classList.remove('active'); }
        });

        const speedBtns = document.querySelectorAll('.pb-speed');
        speedBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                playbackSpeed = parseFloat(this.getAttribute('data-speed'));
                speedBtns.forEach(b => b.classList.remove('speed-active'));
                this.classList.add('speed-active');
            });
        });

        function togglePanelVisibility() { const panel = document.getElementById('control-panel'); panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; }
        function toggleSweep() { showSweep = !showSweep; document.getElementById('sweepStatus').innerText = showSweep ? '開啟' : '關閉'; }
        
        function deletePlane(index) {
            initialPlanes.splice(index, 1);
            saveToLocal();
            simulateTo(simulatedTimestamp);
            updatePlaneListUI();
        }

        function updatePlaneListUI() {
            const listDiv = document.getElementById('plane-list');
            listDiv.innerHTML = '';
            initialPlanes.forEach((plane, index) => { 
                const item = document.createElement('div');
                item.className = 'plane-item';
                item.innerHTML = `<span>✈️ ${plane.id}</span><button class="btn-delete" onclick="deletePlane(${index})">刪除</button>`;
                listDiv.appendChild(item);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'select') return;
            if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') togglePanelVisibility();
            if (e.code === 'KeyF' || e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log("全螢幕請求被阻擋:", err));
                else if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        function drawMap() {
            const cx = canvas.width / 2; const cy = canvas.height / 2;
            ctx.save(); ctx.font = 'bold 60px Arial'; ctx.fillStyle = 'rgba(255, 255, 255, 0.04)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.translate(cx, cy); ctx.rotate(-20 * Math.PI / 180); ctx.fillText('TTSB CONFIDENTIAL REPLAY', 0, -50); ctx.font = 'bold 30px Arial'; ctx.fillText('DO NOT DISTRIBUTE', 0, 20); ctx.restore();
            
            ctx.strokeStyle = 'rgba(84, 132, 152, 0.3)'; ctx.lineWidth = 1; ctx.setLineDash([5, 10]); 
            for(let i = -2000; i < 3000; i += 150) { ctx.beginPath(); ctx.moveTo(i, -500); ctx.lineTo(i, canvas.height + 500); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-500, i); ctx.lineTo(canvas.width + 500, i); ctx.stroke(); } ctx.setLineDash([]); 

            ctx.save(); ctx.strokeStyle = 'rgba(100, 140, 200, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([20, 10, 5, 10]); ctx.beginPath(); ctx.moveTo(-200, cy - 100); ctx.lineTo(canvas.width + 200, cy + 300); ctx.stroke();
            
            // FIR 區塊文字，修正干擾：往左偏移 400，往上微調
            ctx.fillStyle = 'rgba(100, 140, 200, 0.7)'; ctx.font = 'bold 16px "Courier New"'; ctx.translate(cx - 400, cy - 60); 
            const angle = Math.atan2((cy+300)-(cy-100), (canvas.width+200)-(-200)); ctx.rotate(angle); 
            ctx.fillText("NFFF (NADI OCEANIC FIR)", 0, -10); ctx.fillText("NZZO (AUCKLAND OCEANIC FIR)", 0, 25); ctx.restore();

            ctx.fillStyle = 'rgba(104, 142, 162, 0.9)'; ctx.strokeStyle = 'rgba(104, 142, 162, 0.9)'; ctx.font = '12px "Courier New"';
            Object.entries(waypoints).forEach(([name, wp]) => { const px = cx + wp.x; const py = cy + wp.y; ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px + 6, py + 5); ctx.lineTo(px - 6, py + 5); ctx.closePath(); ctx.stroke(); ctx.fillText(name, px + 10, py + 5); });
        }

        function drawRadar() {
            if (isMoving && !isDraggingTimeline) {
                let dt = simulatedTimestamp - lastSimulatedTimestamp;
                if (dt > 0) {
                    if (dt > 1000) dt = 16.666; 
                    stepPhysics(dt);
                }
            }
            lastSimulatedTimestamp = simulatedTimestamp;

            ctx.fillStyle = '#080c10'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawMap();

            const cx = canvas.width / 2; const cy = canvas.height / 2;

            if (showSweep) {
                const currentSweepAngle = ((simulatedTimestamp - timelineStartTime) / 1000) * 1.5;
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(currentSweepAngle);
                const radius = Math.max(canvas.width, canvas.height); const grad = ctx.createConicGradient(0, 0, 0);
                grad.addColorStop(0, 'rgba(50, 168, 113, 0.4)'); grad.addColorStop(0.001, 'rgba(50, 168, 113, 0)'); grad.addColorStop(0.85, 'rgba(50, 168, 113, 0)'); grad.addColorStop(1, 'rgba(50, 168, 113, 0.4)');     
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(radius, 0); ctx.strokeStyle = 'rgba(80, 255, 150, 0.5)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
            }

            lkpMarks.forEach(lkp => {
                const lx = cx + lkp.x; const ly = cy + lkp.y;
                ctx.strokeStyle = '#ff4444'; ctx.fillStyle = '#ff4444'; ctx.lineWidth = 2; ctx.beginPath();
                ctx.moveTo(lx - 8, ly - 8); ctx.lineTo(lx + 8, ly + 8); ctx.moveTo(lx + 8, ly - 8); ctx.lineTo(lx - 8, ly + 8); ctx.stroke();
                ctx.font = 'bold 12px "Courier New"'; ctx.fillText('[X] LKP SIGNAL LOST', lx + 12, ly - 5); ctx.fillText(lkp.time, lx + 12, ly + 10);
            });

            planes.forEach(plane => {
                const isEmergency = (plane.status === '7700' || plane.status === 'EMG');
                const isCST = (plane.status === 'CST');
                const isBlinking = isMoving ? (Math.floor(Date.now() / 500) % 2 === 0) : true;
                
                // 將中心相對座標轉換為畫布上的絕對像素座標來繪製
                const px = cx + plane.x; const py = cy + plane.y;

                let trackColor = '#b5c6d3'; let labelBgColor = 'rgba(12, 18, 24, 0.85)';
                if (isEmergency && isBlinking) { trackColor = '#ff4444'; labelBgColor = 'rgba(255, 68, 68, 0.25)'; } 
                else if (isCST) { trackColor = '#666666'; labelBgColor = 'rgba(50, 50, 50, 0.3)'; }

                ctx.strokeStyle = trackColor; ctx.fillStyle = trackColor; ctx.lineWidth = 1.5;
                plane.history.forEach((pos, index) => {
                    const alpha = 0.2 + (index * 0.15);
                    ctx.fillStyle = isEmergency ? `rgba(255, 68, 68, ${alpha})` : (isCST ? `rgba(100, 100, 100, ${alpha})` : `rgba(181, 198, 211, ${alpha})`);
                    ctx.fillRect(cx + pos.x - 1.5, cy + pos.y - 1.5, 3, 3);
                });

                ctx.beginPath(); ctx.moveTo(px - 5, py); ctx.lineTo(px + 5, py); ctx.moveTo(px, py - 5); ctx.lineTo(px, py + 5); ctx.stroke();
                const radStatic = (plane.heading - 90) * Math.PI / 180; const vectorLength = isCST ? 10 : (plane.speed * 40); 
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(radStatic) * vectorLength, py + Math.sin(radStatic) * vectorLength); ctx.stroke();

                const labelX = px + 25; const labelY = py - 25;
                ctx.beginPath(); ctx.moveTo(px + 5, py - 5); ctx.lineTo(labelX - 5, labelY + 5); ctx.stroke();
                ctx.font = 'bold 13px "Courier New", Courier, monospace'; ctx.fillStyle = labelBgColor; ctx.fillRect(labelX - 2, labelY - 12, 100, 45);
                ctx.fillStyle = (isCST && isBlinking) ? '#333' : trackColor;
                ctx.fillText(plane.id, labelX, labelY); ctx.fillText(plane.altSpd, labelX, labelY + 14); ctx.fillText(plane.status, labelX, labelY + 28);        
            });

            requestAnimationFrame(drawRadar);
        }

        initApp(); 
    </script>
</body>
</html>
